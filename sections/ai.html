<section id="tab-ai" class="tab-content hidden space-y-6">
    <div class="bg-white border-2 border-neoBlack p-6 rounded-2xl shadow-neo flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <div>
            <h2 class="text-2xl font-black heading-font flex items-center gap-2">
                <i class="fa-solid fa-robot text-purple-600"></i> Ayaka AI (Asisten Virtual)
            </h2>
            <p class="text-xs font-semibold text-gray-500">Tanyakan seputar produk, cara order, atau kendala pesanan Anda di sini.</p>
        </div>
        <span class="bg-green-100 text-green-800 border border-green-700 px-2.5 py-1 text-[10px] font-extrabold rounded-full flex items-center gap-1">
            <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> AI ONLINE
        </span>
    </div>

    <div class="bg-white border-2 border-neoBlack rounded-2xl shadow-neo h-[600px] flex flex-col overflow-hidden">
        <!-- AREA CHAT -->
        <div id="ai-chat-box" class="flex-1 p-4 overflow-y-auto space-y-4 bg-gray-50 flex flex-col">
            <!-- Pesan Sambutan AI -->
            <div class="flex items-start gap-2 max-w-[85%]">
                <div class="w-8 h-8 bg-purple-500 border-2 border-neoBlack rounded-lg flex items-center justify-center text-white shrink-0">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div class="bg-white border-2 border-neoBlack p-3 rounded-xl rounded-tl-none shadow-neo-sm text-sm font-medium">
                    Selamat datang di Ayaka-Sync! ✨ Ada yang bisa Ayaka bantu, Kak? Ayaka bisa jawab pertanyaan seputar produk, harga, cara order, sampai tracking pesanan kamu.
                </div>
            </div>
        </div>

        <!-- INPUT AREA -->
        <div class="p-3 border-t-2 border-neoBlack bg-white">
            <form onsubmit="sendAiMessage(event)" class="flex gap-2">
                <input type="text" id="ai-input" placeholder="Ketik pesan Kakak di sini..." autocomplete="off" required
                    class="flex-1 p-3 border-2 border-neoBlack rounded-xl text-sm font-semibold focus:outline-none focus:shadow-neo-sm bg-gray-50 focus:bg-white transition-all">
                <button type="submit" id="btn-send-ai"
                    class="bg-aqua text-neoBlack border-2 border-neoBlack px-5 py-3 rounded-xl font-extrabold shadow-neo hover:bg-cyan-300 transition-all active:scale-95 flex items-center justify-center">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </div>
</section>
