<section id="tab-nokos" class="tab-content hidden space-y-6">
    <div class="bg-white border-2 border-neoBlack p-6 rounded-2xl shadow-neo flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <div>
            <h2 class="text-2xl font-black heading-font flex items-center gap-2">
                <i class="fa-solid fa-phone-volume text-green-600"></i> Nomor Virtual (Nokos OTP)
            </h2>
            <p class="text-xs font-semibold text-gray-500">Beli nomor untuk menerima kode OTP WhatsApp secara otomatis.</p>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- FORM ORDER -->
        <div class="bg-white border-2 border-neoBlack p-6 rounded-2xl shadow-neo space-y-4">
            <div class="p-4 bg-lightCyan border-2 border-neoBlack rounded-xl shadow-neo-sm text-center">
                <i class="fa-brands fa-whatsapp text-5xl text-green-500 mb-2"></i>
                <h3 class="font-extrabold text-lg heading-font">WhatsApp Indonesia</h3>
                <p class="text-sm font-bold text-gray-600 mt-1">Harga: <span id="nokos-price" class="text-neoBlack">Sesuai Server</span></p>
                <p class="text-xs font-semibold text-gray-500">Stok Tersedia (Real-time)</p>
            </div>
            
            <button id="btn-buy-nokos" onclick="buyNokos()" class="w-full bg-neoBlack text-aqua border-2 border-neoBlack p-3 rounded-xl font-extrabold text-sm shadow-neo hover:bg-gray-800 transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-cart-shopping"></i> Beli Nomor Sekarang
            </button>
        </div>

        <!-- HASIL / OTP -->
        <div id="nokos-result-card" class="hidden bg-yellow-100 border-2 border-neoBlack p-6 rounded-2xl shadow-neo space-y-4">
            <div class="flex justify-between items-center border-b-2 border-neoBlack pb-3">
                <div>
                    <span class="text-xs font-extrabold uppercase bg-yellow-300 border border-neoBlack px-2.5 py-0.5 rounded-full inline-flex items-center gap-1">
                        <span class="w-2 h-2 bg-yellow-600 rounded-full pulse-badge"></span> MENUNGGU OTP
                    </span>
                    <h4 class="font-extrabold text-base mt-1">Order ID: <span id="nokos-order-id">-</span></h4>
                </div>
            </div>

            <div class="bg-white p-4 border-2 border-neoBlack rounded-xl shadow-neo-sm text-center">
                <div class="text-xs font-bold text-gray-500 uppercase mb-1">Nomor Anda</div>
                <div id="nokos-number-display" class="text-2xl font-black tracking-widest font-mono text-neoBlack">-</div>
            </div>

            <div class="bg-white p-4 border-2 border-neoBlack rounded-xl shadow-neo-sm text-center">
                <div class="text-xs font-bold text-gray-500 uppercase mb-1">Kode OTP</div>
                <div id="nokos-otp-display" class="text-3xl font-black tracking-widest font-mono text-red-600">- - - -</div>
                <div id="nokos-status-text" class="text-xs font-bold text-blue-600 mt-2">Sedang mengecek pesan masuk...</div>
            </div>

            <button onclick="checkNokosStatus()" class="w-full bg-white text-neoBlack border border-neoBlack p-2 rounded-lg font-bold text-xs shadow-neo-sm hover:bg-gray-100">
                <i class="fa-solid fa-arrows-rotate"></i> Cek Status Manual
            </button>
        </div>
    </div>
</section>
