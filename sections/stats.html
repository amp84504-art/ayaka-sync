<section id="tab-stats" class="tab-content hidden space-y-6">
    <div class="bg-white border-2 border-neoBlack p-6 rounded-2xl shadow-neo flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <div>
            <h2 class="text-2xl font-black heading-font flex items-center gap-2"><i class="fa-solid fa-chart-line text-green-600"></i> Statistik Realtime Server & Transaksi</h2>
            <p class="text-xs font-semibold text-gray-500">Pemantauan otomatis pengunjung, omzet, serta riwayat transaksi database.</p>
        </div>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="bg-white border-2 border-neoBlack p-4 rounded-xl shadow-neo">
            <div class="text-xs font-bold text-gray-500">TOTAL PENGUNJUNG</div>
            <div class="text-2xl font-black heading-font text-blue-600 mt-1" id="stat-total-visitors">0</div>
        </div>
        <div class="bg-white border-2 border-neoBlack p-4 rounded-xl shadow-neo">
            <div class="text-xs font-bold text-gray-500">PENGUNJUNG HARI INI</div>
            <div class="text-2xl font-black heading-font text-emerald-600 mt-1" id="stat-today-visitors">0</div>
        </div>
        <div class="bg-white border-2 border-neoBlack p-4 rounded-xl shadow-neo">
            <div class="text-xs font-bold text-gray-500">TOTAL PEMBELIAN</div>
            <div class="text-2xl font-black heading-font text-purple-600 mt-1" id="stat-total-orders">0</div>
        </div>
        <div class="bg-white border-2 border-neoBlack p-4 rounded-xl shadow-neo">
            <div class="text-xs font-bold text-gray-500">TOTAL OMZET PLATFORM</div>
            <div class="text-2xl font-black heading-font text-neoBlack mt-1" id="stat-total-revenue">Rp 0</div>
        </div>
    </div>

    <div class="bg-white border-2 border-neoBlack rounded-2xl p-6 shadow-neo space-y-4">
        <div class="flex justify-between items-center border-b-2 border-gray-100 pb-3">
            <h3 class="font-extrabold text-lg heading-font">Riwayat Transaksi Terakhir</h3>
            <button onclick="switchTab('transactions')" class="text-xs font-bold text-blue-600 hover:underline">Lihat Semua →</button>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse text-xs md:text-sm">
                <thead>
                    <tr class="border-b-2 border-neoBlack bg-lightCyan font-extrabold">
                        <th class="p-3">ID Order</th>
                        <th class="p-3">Layanan</th>
                        <th class="p-3">Target</th>
                        <th class="p-3">Harga</th>
                        <th class="p-3">Status</th>
                    </tr>
                </thead>
                <tbody id="home-recent-orders-tbody" class="divide-y divide-gray-200 font-medium"></tbody>
            </table>
        </div>
    </div>
</section>
