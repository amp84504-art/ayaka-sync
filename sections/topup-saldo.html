<section id="tab-topup-saldo" class="tab-content hidden space-y-6">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-1 bg-white border-2 border-neoBlack p-6 rounded-2xl shadow-neo space-y-4">
            <div class="flex justify-between items-center border-b-2 border-neoBlack pb-2">
                <h3 class="font-extrabold text-lg heading-font">Deposit Saldo Akun</h3>
                <span class="bg-green-100 text-green-800 border border-green-700 px-2 py-0.5 text-[9px] font-extrabold rounded-full">AIRPAY ONLINE</span>
            </div>
            <div>
                <label class="block text-xs font-bold mb-1">Nominal Top Up (Rp)</label>
                <input type="number" id="topup-amount-input" placeholder="Minimal Rp 1.000" min="1000" class="w-full p-2.5 border-2 border-neoBlack rounded-xl text-xs font-bold">
            </div>
            <div>
                <label class="block text-xs font-bold mb-2">Pilih Payment Gateway / QRIS</label>
                <div class="space-y-2">
                    <label class="flex items-center gap-3 p-3 border-2 border-neoBlack rounded-xl bg-lightCyan cursor-pointer hover:bg-aqua transition-colors">
                        <input type="radio" name="payment-method" value="qris" checked class="accent-neoBlack">
                        <div>
                            <div class="text-xs font-bold flex items-center gap-1.5"><i class="fa-solid fa-qrcode text-neoBlack"></i> Dynamic QRIS AirPay</div>
                            <div class="text-[10px] text-gray-600">Scan via Gopay, OVO, Dana, ShopeePay, Mobile Banking</div>
                        </div>
                    </label>
                </div>
            </div>
            <button id="btn-generate-qris" onclick="requestTopupInvoice()" class="w-full bg-aqua text-neoBlack border-2 border-neoBlack p-3 rounded-xl font-extrabold text-sm shadow-neo hover:bg-cyan-300 transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-qrcode"></i> Generate QRIS AirPay
            </button>
        </div>

        <div class="lg:col-span-2 space-y-6">
            <div id="active-invoice-card" class="hidden bg-yellow-100 border-2 border-neoBlack p-6 rounded-2xl shadow-neo space-y-4">
                <div class="flex justify-between items-center border-b-2 border-neoBlack pb-3">
                    <div>
                        <span class="text-xs font-extrabold uppercase bg-yellow-300 border border-neoBlack px-2.5 py-0.5 rounded-full inline-flex items-center gap-1">
                            <span class="w-2 h-2 bg-yellow-600 rounded-full pulse-badge"></span> MENUNGGU PEMBAYARAN
                        </span>
                        <h4 class="font-extrabold text-base mt-1" id="inv-code">INV-xxx</h4>
                    </div>
                    <div class="text-right">
                        <span class="text-xs text-gray-600 font-semibold">Total Tagihan</span>
                        <div class="text-2xl font-black text-neoBlack" id="inv-total-amount">Rp 0</div>
                    </div>
                </div>
                <div class="flex flex-col sm:flex-row items-center gap-6">
                    <div class="bg-white p-4 border-2 border-neoBlack rounded-xl shadow-neo-sm text-center relative w-full sm:w-auto">
                        <!-- ID IMG DIUBAH MENJADI airpay-qr-img -->
                        <img id="airpay-qr-img" src="" alt="Dynamic QRIS AirPay" class="w-44 h-44 mx-auto border-2 border-neoBlack rounded-lg object-contain bg-white">
                        <span class="text-[10px] font-bold text-gray-600 block mt-2">Scan dengan App Pembayaran Apapun</span>
                    </div>
                    <div class="text-xs space-y-3 font-medium flex-1 w-full">
                        <div class="bg-white border border-neoBlack p-3 rounded-xl shadow-neo-sm space-y-1">
                            <div class="text-[10px] font-bold text-gray-500">EXPIRES AT:</div>
                            <div id="inv-expires-at" class="font-mono font-bold text-red-600 text-xs">-</div>
                        </div>
                        <div class="space-y-2">
                            <a id="btn-payment-url" href="#" target="_blank" class="w-full bg-blue-600 text-white border-2 border-neoBlack p-2.5 rounded-xl font-bold text-xs shadow-neo-sm hover:bg-blue-700 transition-all text-center block">
                                <i class="fa-solid fa-arrow-up-right-from-square"></i> Buka Link Gambar QRIS
                            </a>
                            <div class="flex gap-2">
                                <button onclick="checkCurrentInvoiceStatus()" class="flex-1 bg-white text-neoBlack border border-neoBlack p-2 rounded-lg font-bold text-xs shadow-neo-sm hover:bg-gray-100"><i class="fa-solid fa-arrows-rotate"></i> Cek Status</button>
                                <button onclick="cancelTopupInvoice()" class="flex-1 bg-red-400 text-neoBlack border border-neoBlack p-2 rounded-lg font-bold text-xs shadow-neo-sm hover:bg-red-500"><i class="fa-solid fa-ban"></i> Batalkan</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-white border-2 border-neoBlack p-6 rounded-2xl shadow-neo space-y-3">
                <div class="flex justify-between items-center">
                    <h3 class="font-extrabold text-lg heading-font">Riwayat Deposit Saldo</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead>
                            <tr class="bg-lightCyan border-b-2 border-neoBlack font-bold">
                                <th class="p-3">Kode TRX</th>
                                <th class="p-3">Nominal</th>
                                <th class="p-3">Metode</th>
                                <th class="p-3">Status</th>
                                <th class="p-3">Expires</th>
                            </tr>
                        </thead>
                        <tbody id="topup-history-tbody" class="divide-y divide-gray-200"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</section>
