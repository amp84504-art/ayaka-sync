<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayaka Sync - Maintenance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Menggunakan font bergaya komik -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --yellow: #FFD600;
            --pink: #FF007F;
            --purple: #5B2C8E;
            --dark-purple: #32165B;
            --black: #111111;
            --white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--purple);
            /* Pattern polkadot komik di background */
            background-image: radial-gradient(var(--dark-purple) 15%, transparent 16%), radial-gradient(var(--dark-purple) 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            color: var(--white);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            position: relative;
            text-align: center;
        }

        /* --- EFEK GARIS BAHAYA (CAUTION TAPE) --- */
        .caution-tape {
            position: absolute;
            width: 150%;
            height: 40px;
            background: repeating-linear-gradient(
                -45deg,
                var(--yellow),
                var(--yellow) 20px,
                var(--black) 20px,
                var(--black) 40px
            );
            z-index: -1;
        }
        .tape-top { top: 15%; left: -20%; transform: rotate(-5deg); }
        .tape-bottom { bottom: 25%; left: -20%; transform: rotate(5deg); }

        /* --- TEXT STYLING (GAYA KOMIK) --- */
        .comic-text {
            font-family: 'Bangers', cursive;
            text-transform: uppercase;
            letter-spacing: 2px;
            -webkit-text-stroke: 3px var(--black);
            text-shadow: 4px 4px 0px var(--black);
        }

        /* --- HEADER --- */
        .header-title {
            font-size: 6rem;
            color: var(--yellow);
            line-height: 1;
            transform: rotate(-3deg);
            margin-bottom: 10px;
        }

        .header-subtitle {
            font-size: 4rem;
            color: var(--pink);
            -webkit-text-stroke: 3px var(--black);
            text-shadow: 3px 3px 0px var(--black);
            transform: rotate(2deg);
            margin-top: -20px;
        }

        /* --- KONTEN TENGAH (Karakter & Server) --- */
        .main-content {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            position: relative;
            margin: 40px 0;
            min-height: 400px;
        }

        /* Area untuk Gambar Karakter */
        .character-area {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
        }

        .character-img {
            max-width: 100%;
            height: auto;
            /* Ganti URL di bawah dengan gambar karakter PNG Anda */
            /* content: url('gambar-karakter.png'); */
            width: 350px; 
            height: 400px;
            background: rgba(255, 255, 255, 0.1);
            border: 4px dashed var(--pink);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--yellow);
            font-weight: bold;
        }

        /* Area untuk Gambar Server */
        .server-area {
            flex: 1;
            display: flex;
            justify-content: flex-end;
            position: relative;
        }

        .server-img {
            /* Ganti URL di bawah dengan gambar rak server PNG Anda */
            width: 250px;
            height: 350px;
            background: rgba(0, 0, 0, 0.5);
            border: 4px solid var(--black);
            border-radius: 10px;
            position: relative;
            box-shadow: 10px 10px 0 rgba(0,0,0,0.5);
        }

        /* Stiker di server */
        .sticker {
            position: absolute;
            background: var(--white);
            color: var(--black);
            font-family: 'Bangers', cursive;
            padding: 5px 15px;
            border: 3px solid var(--black);
            box-shadow: 3px 3px 0 var(--black);
            font-size: 1.2rem;
        }
        .sticker.fixing { top: 20%; right: -20px; transform: rotate(15deg); }
        .sticker.reconnect { bottom: 20%; left: -30px; transform: rotate(-10deg); }

        /* Badge melayang (PING, BZZT) */
        .floating-badge {
            position: absolute;
            background: var(--white);
            color: var(--black);
            font-family: 'Bangers', cursive;
            padding: 5px 15px;
            border: 3px solid var(--black);
            border-radius: 20px;
            font-size: 1.5rem;
            box-shadow: 4px 4px 0 var(--black);
            z-index: 10;
        }
        .ping { top: 10%; left: 10%; transform: rotate(-15deg); }
        .bzzt { top: 60%; left: 5%; transform: rotate(10deg); color: var(--pink); }
        .zap { bottom: 10%; right: 5%; transform: rotate(-5deg); color: var(--yellow); font-size: 3rem; background: var(--pink); color: var(--white); border-radius: 0; clip-path: polygon(10% 0, 90% 0, 100% 50%, 90% 100%, 10% 100%, 0% 50%); padding: 10px 30px; }

        /* --- FOOTER / BOX INFO --- */
        .footer-info {
            background: var(--white);
            border: 4px solid var(--black);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 8px 8px 0 var(--black);
            transform: rotate(-1deg);
            margin-top: 20px;
            position: relative;
            z-index: 10;
        }

        .footer-info h3 {
            font-family: 'Bangers', cursive;
            font-size: 3rem;
            color: var(--yellow);
            -webkit-text-stroke: 2px var(--black);
            text-shadow: 3px 3px 0 var(--black);
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .footer-info p {
            color: var(--white);
            background: var(--black);
            display: inline-block;
            padding: 5px 20px;
            font-weight: 900;
            font-size: 1.2rem;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .footer-info .time {
            font-family: 'Bangers', cursive;
            font-size: 2.5rem;
            color: var(--pink);
            -webkit-text-stroke: 2px var(--black);
            text-shadow: 2px 2px 0 var(--black);
            background: none;
            margin: 0;
        }

        .bottom-note {
            background: var(--dark-purple);
            border: 3px solid var(--black);
            color: var(--white);
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            display: inline-block;
            margin-top: 20px;
            font-size: 0.9rem;
            box-shadow: 4px 4px 0 var(--black);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-title { font-size: 4rem; }
            .header-subtitle { font-size: 2.5rem; }
            .main-content { flex-direction: column; align-items: center; gap: 40px; }
            .footer-info h3 { font-size: 2rem; }
            .server-area { justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="caution-tape tape-top"></div>
    <div class="caution-tape tape-bottom"></div>

    <div class="container">
        <!-- Header -->
        <header>
            <h1 class="comic-text header-title">Ayaka Sync</h1>
            <h2 class="comic-text header-subtitle">MAINTENANCE</h2>
        </header>

        <!-- Badge Melayang -->
        <div class="floating-badge ping">PING!</div>
        <div class="floating-badge bzzt">BZZT!</div>

        <!-- Konten Utama -->
        <main class="main-content">
            <!-- Area Karakter (Kiri) -->
            <div class="character-area">
                <!-- GANTI DIV INI DENGAN TAG <img> KARAKTER ANDA -->
                <div class="character-img">
                    [ Tempat Gambar Karakter ]
                </div>
            </div>

            <!-- Area Server (Kanan) -->
            <div class="server-area">
                <div class="floating-badge zap">ZAP!</div>
                <!-- GANTI DIV INI DENGAN TAG <img> SERVER ANDA -->
                <div class="server-img">
                    <!-- Stiker -->
                    <div class="sticker fixing">FIXING...</div>
                    <div class="sticker reconnect">RECONNECT!</div>
                </div>
            </div>
        </main>

        <!-- Info Bawah -->
        <footer>
            <div class="footer-info">
                <h3 class="comic-text">SERVER UNDER REPAIR</h3>
                <p>TOP UP GAME • WE'LL BE BACK SOON!</p>
                <br>
                <span class="time">EST. RESTORE • <span id="countdown">18:30 WIB</span></span>
            </div>
            
            <div class="bottom-note">
                SYSTEM UPDATE • PLEASE WAIT <br> THANKS FOR YOUR PATIENCE!
            </div>
        </footer>
    </div>

    <!-- Script Timer (Opsional agar waktu mundur otomatis) -->
    <script>
        // Set waktu maintenance selesai (Ganti dengan tanggal dan waktu yang diinginkan)
        // Format: 'YYYY-MM-DDTHH:mm:ss'
        const targetDate = new Date();
        targetDate.setHours(18, 30, 0, 0); // Set ke jam 18:30 hari ini

        function updateTimer() {
            const now = new Date().getTime();
            const distance = targetDate.getTime() - now;

            if (distance < 0) {
                document.getElementById("countdown").innerHTML = "SELESAI!";
                return;
            }

            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Format angka agar selalu 2 digit (contoh: 09:05:01)
            const format = (num) => num.toString().padStart(2, '0');

            document.getElementById("countdown").innerHTML = `${format(hours)}:${format(minutes)}:${format(seconds)} WIB`;
        }

        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
