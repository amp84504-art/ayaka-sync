<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AYAKA DIGITAL STORE - Premium Digital & SMM Panel</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/config/tailwind.config.js"></script>

    <!-- Font Awesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="antialiased min-h-screen bg-neoBg">

    <!-- ========================================== -->
    <!-- LAYAR LOGIN (Langsung ditaruh di sini)     -->
    <!-- ========================================== -->
    <div id="login-screen" class="hidden min-h-screen flex items-center justify-center p-4">
        <div class="bg-white border-4 border-neoBlack rounded-3xl shadow-neo-lg p-8 md:p-12 w-full max-w-md relative z-10">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-aqua border-4 border-neoBlack shadow-neo rounded-2xl flex items-center justify-center text-neoBlack font-bold text-4xl heading-font mx-auto mb-4 transform -rotate-3">
                    A
                </div>
                <h2 class="text-3xl font-black heading-font mt-4">Selamat Datang!</h2>
                <p class="text-sm font-semibold text-gray-500 mt-2">Silakan login untuk masuk ke Ayaka Store.</p>
            </div>

            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold mb-1">Username</label>
                    <input type="text" id="login-username" required placeholder="Masukkan username" 
                        class="w-full p-3 border-2 border-neoBlack rounded-xl text-sm font-semibold focus:outline-none focus:shadow-neo-sm focus:bg-white bg-gray-50 transition-all">
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1">Email</label>
                    <input type="email" id="login-email" required placeholder="nama@email.com" 
                        class="w-full p-3 border-2 border-neoBlack rounded-xl text-sm font-semibold focus:outline-none focus:shadow-neo-sm focus:bg-white bg-gray-50 transition-all">
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1">Password</label>
                    <input type="password" id="login-password" required placeholder="••••••••" 
                        class="w-full p-3 border-2 border-neoBlack rounded-xl text-sm font-semibold focus:outline-none focus:shadow-neo-sm focus:bg-white bg-gray-50 transition-all">
                </div>

                <button type="submit" class="w-full bg-neoBlack text-white border-2 border-neoBlack p-3.5 rounded-xl font-extrabold text-sm shadow-neo hover:bg-gray-800 transition-all flex items-center justify-center gap-2 mt-4">
                    <i class="fa-solid fa-right-to-bracket text-aqua"></i> Login ke Dashboard
                </button>
            </form>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- LAYAR DASHBOARD (Muncul jika sudah login)  -->
    <!-- ========================================== -->
    <div id="dashboard-screen" class="hidden flex-col md:flex-row min-h-screen w-full">
        
        <!-- PARTIALS -->
        <div data-include="partials/sidebar.html"></div>
        <div data-include="partials/mobile-header.html"></div>
        <div data-include="partials/mobile-drawer.html"></div>

        <!-- MAIN CONTENT -->
        <main class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full pb-24 md:pb-8">
            <div id="alert-box" class="hidden mb-6 p-4 rounded-xl border-2 border-neoBlack shadow-neo font-bold flex justify-between items-center">
                <span id="alert-msg">Pesan notifikasi di sini...</span>
                <button onclick="closeAlert()"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- SECTIONS -->
            <div data-include="sections/home.html"></div>
            <div data-include="sections/smm.html"></div>
            <div data-include="sections/nokos.html"></div>
            <div data-include="sections/ai.html"></div>
            <div data-include="sections/app-premium.html"></div>
            <div data-include="sections/topup-game.html"></div>
            <div data-include="sections/topup-saldo.html"></div>
            <div data-include="sections/transactions.html"></div>
            <div data-include="sections/stats.html"></div>
            <div data-include="sections/profile.html"></div>
            <div data-include="sections/admin.html"></div>
        </main>

        <div data-include="partials/mobile-bottom-nav.html"></div>
    </div>

    <!-- APP ENTRY -->
    <script type="module" src="assets/js/main.js"></script>
</body>
</html>
